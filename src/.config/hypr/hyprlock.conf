# hyprlock config (hyprlang format; hyprlock doesn't read Lua).
# Upstream example: /usr/share/hypr/hyprlock.conf
#
# Started by the Alt+L bind in hyprland.lua and the power menu, both as
# `pidof hyprlock || uwsm app -- hyprlock` so a second press doesn't stack locks.
# If a broken config ever leaves you stuck: Ctrl+Alt+F3, log in, `pkill hyprlock`.

# Fallback colors (gruvbox, matching hyprland.lua's fallbacks). The wal
# file below overrides them; if it's missing hyprlock logs an error and keeps
# going with these, so the lock screen still works.
$background = rgb(1d2021)
$foreground = rgb(ebdbb2)
$accent = rgb(98971a)
$accentAlpha = rgba(98971aD0)
source = ~/.cache/wal/colors-hyprlock.conf

# $fail and $warn stay fixed: wal palettes rarely have a usable red/yellow.
$fail = rgb(cc241d)
$warn = rgb(d79921)

$font = MesloLGS NF

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 3, linear
    animation = fadeOut, 1, 3, linear
    animation = inputFieldDots, 1, 2, linear
}

# Blurred screenshot of the current screen, like the old swaylock --screenshots.
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    brightness = 0.7
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 3
    rounding = 12

    outer_color = $accent $accentAlpha 45deg
    inner_color = rgba(00000088)
    font_color = $foreground
    check_color = $warn
    fail_color = $fail
    capslock_color = $warn

    font_family = $font
    placeholder_text = <i>Password...</i>
    fail_text = $PAMFAIL
    fade_on_empty = false
    dots_spacing = 0.3

    position = 0, -80
    halign = center
    valign = center
}

# Clock
label {
    monitor =
    text = $TIME
    color = $foreground
    font_size = 90
    font_family = $font

    position = 0, 120
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = $foreground
    font_size = 22
    font_family = $font

    position = 0, 30
    halign = center
    valign = center
}
