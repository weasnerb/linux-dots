# Generated by pywal from ~/.config/wal/templates/colors-fuzzel.ini
# Pulled in by fuzzel.ini via an include= line. Regenerate with: wal -R
# fuzzel wants RGBA hex with no leading '#', so each value uses pywal's .strip form.
#
# NOTE: pywal runs .format() over this ENTIRE file, so a brace in a comment is
# treated as a substitution and will break wal -R with a KeyError.
#
# Contrast budget, deliberately unequal:
#   - unselected rows sit BACK (dim grey, ~7:1) so they read as context
#   - the selected row is the brightest thing on screen (~15:1, inverted)
#   - matched letters stay brighter than the dim text so they still pop
# pywal color1-4 are the dark/saturated half of the palette and land ~4:1 on a
# dark background, so they are used only for accents, never for row text.
[colors]
background={background.strip}f2

# unselected entries: dimmed on purpose
text={color8.strip}ff
match={color5.strip}ff

# what you type stays bright, so the prompt line is always legible
input={foreground.strip}ff
prompt={color4.strip}ff
placeholder={color2.strip}ff
counter={color2.strip}ff

# selected row: NOT inverted. A faint tinted bar (alpha 59 = 35%) plus text
# lifted to full foreground brightness -- the jump from dim 7:1 body text to
# 15:1 selected text is what marks the row, the bar just anchors it.
selection={color2.strip}59
selection-text={foreground.strip}ff
selection-match={color5.strip}ff

border={color4.strip}ff
