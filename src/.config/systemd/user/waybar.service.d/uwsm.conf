# Drop-in for the packaged waybar.service, per uwsm's example override.
# - Type=exec so systemd waits for the process to actually exec
# - ExecCondition keeps it from starting under a compositor it is not meant for
# - app-graphical.slice keeps it out of session.slice (which has resource priority)
[Service]
Type=exec
ExecCondition=/usr/lib/systemd/systemd-xdg-autostart-condition "wlroots:sway:Wayfire:labwc:Hyprland" ""
Slice=app-graphical.slice
