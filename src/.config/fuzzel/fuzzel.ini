# fuzzel -- Wayland-native launcher (replaced wofi 2026-09-20: wofi is GTK and
# resized its window on every keystroke; fuzzel has fixed geometry by design).
#
# Colors come from pywal; regenerate after a theme change with `wal -R`.
include=/home/brian/.cache/wal/colors-fuzzel.ini

font=Source Code Pro:size=13
terminal=alacritty
icon-theme=Adwaita

# Anchored instead of centred. fuzzel sizes its surface before the compositor
# reports the fractional scale (1.25 here), then corrects by ~7x3px shortly
# after mapping. Centred, that correction re-centres the window and reads as
# the whole thing shifting; anchored, the top-left corner stays put and only
# the right/bottom edge settles.
# anchor=top keeps fuzzel horizontally centred by the compositor (so this works
# on both machines regardless of resolution) while pinning it vertically.
# Residual motion is the ~4px horizontal re-centre, down from a full re-centre
# in both axes.
anchor=top
y-margin=354

# Fixed geometry: width in characters, lines = matches shown.
width=60
lines=8

# Roomier rows/padding. line-height overrides the font metrics.
line-height=32
horizontal-pad=20
vertical-pad=14
inner-pad=8

# sort-result defaults to yes: results are ranked by launch count (cached in
# ~/.cache/fuzzel, written on exit) plus match length -- i.e. the most-used
# apps float to the top, like rofi did.

# Hand launched apps to uwsm so each gets its own systemd scope, the same
# reason menu.sh used to wrap wofi. fuzzel also exports DESKTOP_ENTRY_*,
# which `uwsm app` picks up for proper unit naming.
launch-prefix=uwsm app --

[border]
width=2
radius=10
# rounded pill for the selected row, instead of a full-width slab
selection-radius=6
