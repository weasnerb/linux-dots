# hypridle config (hyprlang format; hypridle doesn't read Lua).
# Run by hypridle.service (shipped by the package), wanted by graphical-session.target.
#
# Screen-off only: never locks. Lock by hand with Alt+L or the power menu.
# The displays turn off after an hour idle (e.g. falling asleep at the desk)
# and the first key press or mouse move turns them back on, unlocked.
#
# hypridle honours idle inhibitors (video players, browsers playing video,
# etc.), so watching something long won't blank the screens.

listener {
    timeout = 3600
    # Under the Lua config, `hyprctl dispatch` takes Lua. Use the
    # { action = ... } table: a bare string like "off" is silently treated as
    # a toggle.
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
